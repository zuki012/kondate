<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5EF">
<title>今週なに食べよ</title>
<script>try{var t=localStorage.getItem("kondate.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 縦に日付・横に朝昼晩＋αの献立表。上にモード切替、下から開くシートで登録と買い出し。 */
:root{
  --paper:#F4F5EF; --surface:#FFFFFF; --ink:#23291F; --muted:#6A7165; --line:#DCDFD3;
  --accent:#2E6B4C; --accent-ink:#FFFFFF; --accent-soft:#E2EDE5;
  --shop:#9A6A0E; --shop-ink:#FFFFFF; --shop-soft:#F5EBD3;
  --sat:#2F5DA6; --sun:#B23F38; --danger:#B23F38;
  --shadow:0 -8px 30px rgba(30,40,30,.14);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --datecol:54px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131612; --surface:#1B1F1A; --ink:#E6E9E1; --muted:#9BA295; --line:#2C3229;
  --accent:#86C9A2; --accent-ink:#0F1A13; --accent-soft:#1E3226;
  --shop:#E3B14E; --shop-ink:#1E1606; --shop-soft:#372C13;
  --sat:#93B4EE; --sun:#F08F87; --danger:#F08F87; --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131612; --surface:#1B1F1A; --ink:#E6E9E1; --muted:#9BA295; --line:#2C3229;
  --accent:#86C9A2; --accent-ink:#0F1A13; --accent-soft:#1E3226;
  --shop:#E3B14E; --shop-ink:#1E1606; --shop-soft:#372C13;
  --sat:#93B4EE; --sun:#F08F87; --danger:#F08F87; --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body{--mode:var(--accent);--mode-ink:var(--accent-ink);--mode-soft:var(--accent-soft)}
body.shop{--mode:var(--shop);--mode-ink:var(--shop-ink);--mode-soft:var(--shop-soft)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--mode);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.row{scroll-margin-top:170px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
.titleline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:.04em}
.sync{font-size:11px;color:var(--muted);white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
.gear{border:0;background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;margin:-6px -8px -6px 0}
.gear:hover{background:var(--mode-soft)}
/* 料金がかかるボタンの印（黄色い丸に¥） */
.yen{display:inline-grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;background:#F2C230;color:#3A2A00;font-size:.8em;font-weight:700;margin-right:.45em;vertical-align:.08em;box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--mode);color:var(--mode-ink)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.hint{font-size:12px;color:var(--muted);margin:0}

.grid{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:var(--datecol) repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.head{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,118px));z-index:10;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.head div{font-size:12px;font-weight:700;text-align:center;padding:6px 2px;letter-spacing:.1em}
.date{padding:8px 4px 8px 0;display:flex;flex-direction:column;align-items:flex-start}
.date .md{font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.date .wd{font-size:11px;color:var(--muted);font-weight:700}
.row.sat .wd{color:var(--sat)} .row.sun .wd{color:var(--sun)}
.row.past{opacity:.62}
.row.today .date .md::after{content:"今日";display:inline-block;margin-left:4px;font-family:var(--f-body);font-size:10px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 4px;vertical-align:3px}
.cell{min-height:58px;border:0;border-left:1px dashed var(--line);background:transparent;text-align:left;padding:6px 5px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.cell:hover{background:var(--mode-soft)}
.cell .add{color:var(--line);font-size:18px;line-height:1;margin:auto}
body.shop .cell .add{visibility:hidden}
.chip{display:block;font-size:12px;line-height:1.35;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 5px;overflow-wrap:anywhere;word-break:break-word}
.chip.url{border-style:dashed}
.chip.text{background:transparent}
.chip.bt{border-left:3px solid var(--mode)}
.btfilter{display:flex;flex-direction:column;gap:6px}
.btfilter .genres span{flex:none;font-size:11px;color:var(--muted);align-self:center;min-width:3.2em}
.results a.pdf{font-size:11px;color:var(--muted)}
.cell.sel{background:var(--shop-soft)}
.cell.edge{box-shadow:inset 0 0 0 2px var(--shop)}
.more{display:block;width:100%;margin:10px 0;padding:10px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-weight:500;cursor:pointer}

.shopbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.shopbar .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.rangeline{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.rangeline b{font-variant-numeric:tabular-nums}
.ppl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.shopbtns{display:flex;gap:8px}
.shopbtns #histBtn{flex:none;width:auto;padding-left:14px;padding-right:14px}
.shopbtns #makeList{flex:1;min-width:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 2px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.hist button:hover{background:var(--mode-soft)}
.hist .nm{font-weight:500;overflow-wrap:anywhere}
.hist .meta{font-size:11px;color:var(--muted)}
.backlink{border:0;background:transparent;color:var(--mode);font-weight:700;padding:0;cursor:pointer;font-size:13px;align-self:flex-start}
.ppl select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--mode);color:var(--mode-ink);width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.shot{display:block;text-align:center}
textarea.field{resize:vertical;line-height:1.5}

.scrim{position:fixed;inset:0;background:rgba(10,14,10,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:88%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .in{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sh-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700}
.x{border:0;background:var(--paper);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.sh-body>*{flex-shrink:0}
.sh-body{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sh-foot{position:sticky;bottom:-20px;margin:0 -16px -20px;padding:10px 16px 14px;background:var(--surface);border-top:1px solid var(--line)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0 0 6px}
.current{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.current li{display:flex;align-items:center;gap:8px;background:var(--mode-soft);border-radius:10px;padding:8px 8px 8px 12px}
.current li span{flex:1;min-width:0;overflow-wrap:anywhere}
.current li small{display:block;color:var(--muted);font-size:11px}
.current li small.nt{color:var(--mode);font-weight:700}
.current li.ne{background:transparent;padding:0 0 4px;gap:6px}
.current li.ne .field{flex:1;min-width:0}
.current li.ne .btn{width:auto;flex:none;padding:10px 14px}
.chip .cn{display:block;font-size:10px;color:var(--muted)}
.rm{border:0;background:transparent;color:var(--danger);font-weight:700;padding:6px 8px;cursor:pointer;border-radius:8px}
.rm.nb{color:var(--mode)}
.empty{color:var(--muted);font-size:13px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.genres{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.genres button{flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.genres button[aria-pressed="true"]{border-color:var(--mode);color:var(--mode);font-weight:700}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.results li button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.results li button:hover{background:var(--mode-soft)}
.results .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.results .meta{display:block;font-size:11px;color:var(--muted);font-weight:400}
.results .plus{flex:none;color:var(--mode);font-weight:700;font-size:13px;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.6}

.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--shop);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.cat{display:flex;flex-direction:column}
.cat h3{font-size:13px;margin:0 0 4px;padding-bottom:4px;border-bottom:1.5px solid var(--ink);letter-spacing:.06em}
.item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--shop)}
.item .nm{font-weight:500;overflow-wrap:anywhere}
.item .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.item .amt{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;white-space:nowrap}
.item.done .nm,.item.done .amt{text-decoration:line-through;color:var(--muted)}
.checkbox{background:var(--shop-soft);border-radius:10px;padding:10px 12px}
.ck-h{margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.ck-list{margin:0;font-size:13px;line-height:1.7}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
summary{cursor:pointer;font-size:13px;font-weight:500}
details pre{white-space:pre-wrap;font-family:var(--f-body);font-size:12px;margin:6px 0 10px;color:var(--muted)}
details h4{margin:10px 0 0;font-size:13px}
.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
body.shop .toast{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
body .toast.top{top:calc(16px + env(safe-area-inset-top,0px));bottom:auto}
.row2{display:flex;gap:8px}
.login{max-width:360px;margin:18vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:26px}
.passrow{display:flex;gap:8px}
.passrow .field{flex:1;min-width:0}
.field.masked{-webkit-text-security:disc}
.btn.peek{width:auto;flex:none;padding:0 14px;font-size:13px}
@media (max-width:380px){:root{--datecol:46px}.chip{font-size:11px}.date .md{font-size:15px}}
</style>
</head>
<body>

<form class="login" id="login" hidden>
  <h1>今週なに食べよ</h1>
  <p class="note">ふたりで決めた合言葉を入れてください。この端末では次回から入力不要です。</p>
  <div class="passrow">
    <input class="field masked" id="pass" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉（日本語も入力できます）">
    <button class="btn ghost peek" type="button" id="peek" aria-pressed="false">表示</button>
  </div>
  <button class="btn" type="submit">開く</button>
  <p class="err" id="loginErr" hidden></p>
</form>

<div class="wrap" id="app" hidden>
  <header class="bar" id="bar">
    <div class="titleline">
      <h1>今週なに食べよ</h1>
      <span class="tools"><span class="sync" id="sync">読み込み中…</span><button class="gear" id="gearBtn" aria-label="設定"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></span>
    </div>
    <div class="seg" role="group" aria-label="モード">
      <button id="m-recipe" aria-pressed="true">レシピを決める</button>
      <button id="m-shop" aria-pressed="false">買い出し</button>
    </div>
    <p class="hint" id="hint">マスをタップすると、その食事にレシピを登録できます。</p>
  </header>
  <div class="grid" id="grid" aria-label="献立表"></div>
</div>

<div class="shopbar" id="shopbar" hidden>
  <div class="in">
    <div class="rangeline">
      <span id="rangeText">最初のマスをタップ</span>
      <label class="ppl" for="ppl">人数
        <select id="ppl"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
      </label>
    </div>
    <div class="shopbtns">
      <button class="btn ghost" id="histBtn" aria-label="過去の買い出しリスト">履歴</button>
      <button class="btn" id="makeList" disabled><span class="yen" aria-hidden="true">¥</span>買い出しリストを作る</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="in">
    <div class="sh-head">
      <h2 id="sheetTitle"></h2>
      <button class="x" id="closeSheet" aria-label="閉じる">×</button>
    </div>
    <div class="sh-body" id="sheetBody"></div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script>
// 開くたびに、タイトルがちょっと変わる（遊び心）。直前と同じものは出さない
(function(){
  var T=["今週なに食べよ","今日なに食べよ","なに食べたい？","おなかすいた","ふたりごはん","もぐもぐ会議","今夜のごはんは？","食べたいものは？","冷蔵庫と相談","なにつくろ","今日もごはん","ごはんの時間だよ","今週もおいしく","ごはん何にする？"];
  var last=-1;try{last=Number(localStorage.getItem("kondate.title"));}catch(e){}
  var i;do{i=Math.floor(Math.random()*T.length);}while(i===last&&T.length>1);
  try{localStorage.setItem("kondate.title",String(i));}catch(e){}
  document.querySelectorAll("h1").forEach(function(h){h.textContent=T[i];});
})();
</script>
<script>
(() => {
"use strict";
const SLOTS = [{k:"m",l:"朝"},{k:"l",l:"昼"},{k:"d",l:"晩"},{k:"x",l:"＋α"}];
const WD = ["日","月","火","水","木","金","土"];
const GENRES = ["すべて","和食","洋食","中華","イタリアン・フレンチ","アジア","スイーツ","ヘルシー料理"];
const CATS = ["野菜・果物","きのこ","肉","魚介","卵・乳製品","豆腐・大豆製品","主食・麺","乾物・缶詰","調味料・スパイス","その他"];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- 合言葉とAPI ---------- */
const PASS_KEY = "kondate.pass";
const getPass = () => { try { return localStorage.getItem(PASS_KEY) || ""; } catch(e){ return ""; } };
const setPass = v => { try { localStorage.setItem(PASS_KEY, v); } catch(e){} };
class AuthError extends Error {}
async function api(path, opts = {}){
  const res = await fetch(path, {
    ...opts,
    headers: {"Content-Type":"application/json", "x-app-pass": encodeURIComponent(getPass()), ...(opts.headers || {})},
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401) throw new AuthError(json.error || "合言葉が違います");
  if (!res.ok) throw new Error(json.error || `通信エラー（${res.status}）`);
  return json;
}
function showLogin(msg){
  $("app").hidden = true; $("login").hidden = false;
  $("loginErr").hidden = !msg; $("loginErr").textContent = msg || "";
  $("pass").focus();
}
$("peek").addEventListener("click", () => {
  const masked = $("pass").classList.toggle("masked");
  $("peek").textContent = masked ? "表示" : "隠す";
  $("peek").setAttribute("aria-pressed", String(!masked));
  $("pass").focus();
});
$("login").addEventListener("submit", e => {
  e.preventDefault();
  setPass($("pass").value.trim());
  start();
});

/* ---------- 日付 ---------- */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = new Date(); today.setHours(0,0,0,0);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const dayNo = d => Math.round((d - new Date(2020,0,1)) / 864e5);
const label = (dk, sk) => { const d = fromKey(dk); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）${SLOTS.find(s=>s.k===sk).l}`; };
const ordOf = (dk, sk) => dayNo(fromKey(dk)) * 4 + SLOTS.findIndex(s => s.k === sk);
let pastDays = 0, futureDays = 21;

/* ---------- 献立データ（Notionに保存） ---------- */
const cells = new Map();
let mode = "recipe", pending = 0;

async function loadPlan(){
  const from = keyOf(addDays(today, -pastDays)), to = keyOf(addDays(today, futureDays));
  try {
    const { cells: got } = await api(`/api/plan?from=${from}&to=${to}`);
    if (pending) return; // 保存中は上書きしない
    cells.clear();
    for (const k in got) cells.set(k, got[k]);
    $("sync").textContent = "Notionと同期済み";
    render();
    if (openKey) renderCurrent();
  } catch(e){
    if (e instanceof AuthError) return showLogin(e.message);
    $("sync").textContent = "同期できません";
    toast(e.message);
  }
}

async function saveCell(key, items){
  if (items.length) cells.set(key, items); else cells.delete(key);
  render();
  const [date, slot] = key.split("_");
  pending++; $("sync").textContent = "保存中…";
  try {
    await api("/api/plan", {method:"POST", body: JSON.stringify({date, slot, items})});
    $("sync").textContent = "Notionと同期済み";
  } catch(e){
    if (e instanceof AuthError) return showLogin(e.message);
    $("sync").textContent = "保存できませんでした";
    toast("保存できませんでした：" + e.message);
  } finally { pending--; }
}

/* ---------- 献立表 ---------- */
let selA = null, selB = null;
function inRange(dk, sk){
  if (!selA) return false;
  const o = ordOf(dk, sk), a = ordOf(selA.d, selA.s);
  if (!selB) return o === a;
  const b = ordOf(selB.d, selB.s);
  return o >= Math.min(a,b) && o <= Math.max(a,b);
}
const isEdge = (dk, sk) => (selA && selA.d===dk && selA.s===sk) || (selB && selB.d===dk && selB.s===sk);
function chipHTML(it){
  const cls = it.type === "url" ? "chip url" : it.type === "text" ? "chip text" : it.type === "beetto" ? "chip bt" : "chip";
  return `<span class="${cls}">${esc(it.name)}${it.note ? `<span class="cn">${esc(it.note)}</span>` : ""}</span>`;
}
function render(){
  let h = `<div class="row head" aria-hidden="true"><div></div>${SLOTS.map(s=>`<div>${s.l}</div>`).join("")}</div>`;
  h += `<button class="more" id="morePast">${pastDays ? "さらに前の週を表示" : "過去の献立を表示"}</button>`;
  for (let i = -pastDays; i < futureDays; i++){
    const d = addDays(today, i), dk = keyOf(d), wd = d.getDay();
    const cls = ["row", i < 0 ? "past" : "", i === 0 ? "today" : "", wd === 6 ? "sat" : "", wd === 0 ? "sun" : ""].join(" ");
    h += `<div class="${cls}"><div class="date"><span class="md">${d.getMonth()+1}/${d.getDate()}</span><span class="wd">${WD[wd]}</span></div>`;
    for (const s of SLOTS){
      const items = cells.get(`${dk}_${s.k}`) || [];
      const sel = mode === "shop" && inRange(dk, s.k) ? " sel" : "";
      const edge = mode === "shop" && isEdge(dk, s.k) ? " edge" : "";
      const aria = `${label(dk, s.k)}：${items.length ? items.map(x=>x.name).join("、") : "未登録"}`;
      h += `<button class="cell${sel}${edge}" data-d="${dk}" data-s="${s.k}" aria-label="${esc(aria)}">${items.length ? items.map(chipHTML).join("") : '<span class="add">＋</span>'}</button>`;
    }
    h += `</div>`;
  }
  h += `<button class="more" id="moreFuture">さらに2週間先を表示</button>`;
  $("grid").innerHTML = h;
  updateShopBar();
}
$("grid").addEventListener("click", e => {
  if (e.target.closest("#morePast")){ pastDays += 7; render(); loadPlan(); return; }
  if (e.target.closest("#moreFuture")){ futureDays += 14; render(); loadPlan(); return; }
  const c = e.target.closest(".cell"); if (!c) return;
  const d = c.dataset.d, s = c.dataset.s;
  if (mode === "recipe") openRecipeSheet(d, s);
  else {
    if (!selA || selB){ selA = {d, s}; selB = null; }
    else { selB = {d, s}; if (ordOf(d,s) < ordOf(selA.d, selA.s)) [selA, selB] = [selB, selA]; }
    render();
  }
});

/* ---------- モード ---------- */
function setMode(m){
  mode = m;
  document.body.classList.toggle("shop", m === "shop");
  $("m-recipe").setAttribute("aria-pressed", m === "recipe");
  $("m-shop").setAttribute("aria-pressed", m === "shop");
  $("hint").textContent = m === "recipe" ? "マスをタップすると、その食事にレシピを登録できます。"
                                         : "買い出しの対象にする最初のマスと最後のマスを順にタップします。";
  $("shopbar").hidden = m !== "shop";
  render();
}
$("m-recipe").onclick = () => setMode("recipe");
$("m-shop").onclick = () => setMode("shop");

function rangeItems(){
  const out = [];
  if (!selA) return out;
  const a = ordOf(selA.d, selA.s), b = selB ? ordOf(selB.d, selB.s) : a;
  for (const [k, items] of cells){
    const [d, s] = k.split("_"), o = ordOf(d, s);
    if (o >= Math.min(a,b) && o <= Math.max(a,b)) for (const it of items) out.push({...it, o});
  }
  return out.sort((x,y) => x.o - y.o);
}
function updateShopBar(){
  if (mode !== "shop") return;
  const t = $("rangeText"), btn = $("makeList");
  if (!selA){ t.textContent = "最初のマスをタップ"; btn.disabled = true; return; }
  const items = rangeItems();
  const span = selB ? `${label(selA.d, selA.s)} → ${label(selB.d, selB.s)}` : `${label(selA.d, selA.s)}（次に最後のマスをタップ）`;
  t.innerHTML = `<span><b>${esc(span)}</b><br>${items.length}品</span>`;
  btn.disabled = !items.some(x => x.type === "recipe" || x.type === "beetto" || x.type === "url" || x.type === "text");
}

/* ---------- 下から出る画面 ---------- */
let noteEdit = -1; // 「指示」を書いているレシピの番号
let openKey = null, tab = "search", genre = "すべて", query = "", searchTimer = null, searchSeq = 0, lastResults = [];
// beetto：自由検索＋フェーズ・朝昼夜で絞り込み
let btQuery = "", btPhase = 0, btMeal = "", btResults = [], btTimer = null, btSeq = 0;
const BT_PHASES = [[0,"すべて"],[1,"1"],[2,"2"],[3,"3"],[4,"4・5"]], BT_MEALS = ["","朝","昼","夜"];
const btPhaseLabel = p => p === 4 ? "Phase4・5" : `Phase${p}`;
function showSheet(title){ settingsOpen = false; $("sheetTitle").textContent = title; $("scrim").hidden = false; $("sheet").hidden = false; }
function closeSheet(){ $("scrim").hidden = true; $("sheet").hidden = true; openKey = null; settingsOpen = false; }
$("scrim").onclick = closeSheet; $("closeSheet").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

function openRecipeSheet(d, s){
  openKey = `${d}_${s}`; query = ""; tab = "search"; noteEdit = -1;
  showSheet(label(d, s));
  renderRecipeSheet();
  runSearch();
}

function runSearch(){
  clearTimeout(searchTimer);
  const seq = ++searchSeq;
  const el = $("results");
  if (el) el.innerHTML = `<li><p class="empty">Notionを検索中…</p></li>`;
  searchTimer = setTimeout(async () => {
    try {
      const qs = new URLSearchParams({q: query.trim(), genre});
      const { recipes } = await api(`/api/recipes?${qs}`);
      if (seq !== searchSeq) return;
      lastResults = recipes;
      const r = $("results"); if (r) r.innerHTML = resultsHTML(recipes);
    } catch(e){
      if (e instanceof AuthError) return showLogin(e.message);
      const r = $("results"); if (r) r.innerHTML = `<li><p class="err">${esc(e.message)}</p></li>`;
    }
  }, query ? 300 : 0);
}

function resultsHTML(list){
  if (!list.length) return `<li><p class="empty">見つかりませんでした。別のことばで探すか、「メモ」に書いて登録できます。</p></li>`;
  return list.map(r => `<li><button data-add="${esc(r.id)}" data-name="${esc(r.name)}">
    <span class="nm">${esc(r.name)}<span class="meta">${[r.genre, r.category, r.time].filter(Boolean).map(esc).join("・")}</span></span>
    <span class="plus">＋追加</span></button></li>`).join("");
}

function btResultsHTML(list){
  if (!list.length) return `<li><p class="empty">見つかりませんでした。ことばを変えるか、絞り込みを「すべて」に戻してみてください。</p></li>`;
  return `<li><p class="note">${list.length}品</p></li>` + list.map(r => `<li><button data-btadd="${esc(r.id)}" data-name="${esc(r.name)}">
    <span class="nm">${esc(r.name)}<span class="meta">${esc(btPhaseLabel(r.phase))}・${esc(r.meal)}・${esc(r.base)}</span></span>
    <span class="plus">＋追加</span></button></li>`).join("");
}
function runBtSearch(){
  clearTimeout(btTimer);
  const seq = ++btSeq;
  btTimer = setTimeout(async () => {
    try {
      const qs = new URLSearchParams({q: btQuery.trim(), phase: String(btPhase), meal: btMeal});
      const { recipes } = await api(`/api/beetto?${qs}`);
      if (seq !== btSeq) return;
      btResults = recipes;
      const r = $("btresults"); if (r) r.innerHTML = btResultsHTML(recipes);
    } catch(e){
      if (e instanceof AuthError) return showLogin(e.message);
      const r = $("btresults"); if (r) r.innerHTML = `<li><p class="err">${esc(e.message)}</p></li>`;
    }
  }, btQuery ? 200 : 0);
}

function currentHTML(){
  const items = cells.get(openKey) || [];
  return items.length
    ? `<ul class="current">${items.map((it, i) => `<li><span>${esc(it.name)}${it.type==="url" ? `<small>${esc(it.url || "材料を登録済み")}</small>` : it.type==="text" ? "<small>メモ</small>" : it.type==="beetto" ? "<small>beetto</small>" : ""}${it.note ? `<small class="nt">指示：${esc(it.note)}</small>` : ""}</span>${it.type !== "text" ? `<button class="rm nb" data-note="${i}" aria-label="${esc(it.name)}に指示を書く">指示</button>` : ""}<button class="rm" data-rm="${i}" aria-label="${esc(it.name)}を外す">外す</button></li>${noteEdit === i ? `<li class="ne"><input class="field" id="noteIn" type="text" maxlength="100" placeholder="例：ピーマンの春巻きだけ、ツナ抜き、半量" value="${esc(it.note || "")}"><button class="btn" data-notesave="${i}">保存</button></li>` : ""}`).join("")}</ul>`
    : `<p class="empty">まだ何も登録されていません。下から探して追加できます。</p>`;
}
function footHTML(){
  const n = (cells.get(openKey) || []).length;
  return `<button class="btn" id="doneSheet">${n ? `この内容で決定（${n}品）` : "閉じる"}</button>`;
}
function renderCurrent(){
  const c = $("currentBox"), f = $("footBox");
  if (c) c.innerHTML = currentHTML();
  if (f) f.innerHTML = footHTML();
}

function renderRecipeSheet(){
  const tabs = `<div class="tabs" role="tablist">
      <button role="tab" data-tab="search" aria-selected="${tab==="search"}">Notion</button>
      <button role="tab" data-tab="beetto" aria-selected="${tab==="beetto"}">beetto</button>
      <button role="tab" data-tab="url" aria-selected="${tab==="url"}">URLを貼る</button>
      <button role="tab" data-tab="text" aria-selected="${tab==="text"}">メモ</button></div>`;
  let pane = "";
  if (tab === "search"){
    pane = `<input class="field" id="q" type="search" placeholder="料理名で探す（例：なす、鶏もも）" value="${esc(query)}" autocomplete="off">
      <div class="genres">${GENRES.map(g => `<button data-genre="${esc(g)}" aria-pressed="${g===genre}">${esc(g)}</button>`).join("")}</div>
      <ul class="results" id="results">${resultsHTML(lastResults)}</ul>`;
  } else if (tab === "beetto"){
    pane = `<input class="field" id="btq" type="search" placeholder="料理名や材料で探す（例：サーモン）" value="${esc(btQuery)}" autocomplete="off">
      <div class="btfilter">
        <div class="genres"><span>フェーズ</span>${BT_PHASES.map(([v,l]) => `<button data-btphase="${v}" aria-pressed="${v===btPhase}">${l}</button>`).join("")}</div>
        <div class="genres"><span>食事</span>${BT_MEALS.map(m => `<button data-btmeal="${m}" aria-pressed="${m===btMeal}">${m || "すべて"}</button>`).join("")}</div>
      </div>
      <ul class="results" id="btresults">${btResultsHTML(btResults)}</ul>`;
  } else if (tab === "url"){
    pane = `<input class="field" id="urlIn" type="url" inputmode="url" placeholder="https://… レシピのページのURL（スクショだけなら空欄でOK）">
      <input class="field" id="urlName" type="text" placeholder="料理名（例：鶏むねのねぎ塩炒め）">
      <textarea class="field" id="urlIng" rows="5" placeholder="材料（空欄でOK。XやInstagramなど読み取れないページは、下のボタンでスクショから読み取るか、貼り付け）"></textarea>
      <label class="btn ghost shot" for="shotIn"><span class="yen" aria-hidden="true">¥</span>スクショから材料を読み取る</label>
      <input id="shotIn" type="file" accept="image/*" multiple hidden>
      <p class="note" id="shotStatus" hidden></p>
      <button class="btn" id="addUrl">この料理を追加</button>
      <p class="note">URLだけで登録すると、買い出しリストを作るときにページから材料を読み取ります（無料）。スクショの読み取りはAIを使うので、1回数円かかります。</p>`;
  } else {
    pane = `<input class="field" id="memo" type="text" placeholder="例：納豆ごはん、キャベツ1玉、外食">
      <button class="btn" id="addMemo">メモを追加</button>
      <p class="note">メモに書いた食材や料理も、買い出しリストに入ります。分量が書いてあればその量、なければ一般的な量で入れます。「外食」「残り物」など買い物が要らないものは入りません。</p>`;
  }
  $("sheetBody").innerHTML = `<div><p class="lbl">この食事のレシピ</p><div id="currentBox">${currentHTML()}</div></div>${tabs}${pane}<div class="sh-foot" id="footBox">${footHTML()}</div>`;
}

$("sheetBody").addEventListener("click", e => {
  if (!openKey) return;
  const items = [...(cells.get(openKey) || [])];
  const t = e.target;
  if (t.closest("#doneSheet")){
    const n = items.length, where = $("sheetTitle").textContent;
    closeSheet(); if (n) toast(`${where}に${n}品を登録しました`); return;
  }
  const rm = t.closest("[data-rm]");
  if (rm){ items.splice(Number(rm.dataset.rm), 1); noteEdit = -1; saveCell(openKey, items); renderCurrent(); return; }
  const nb = t.closest("[data-note]");
  if (nb){ const i = Number(nb.dataset.note); noteEdit = noteEdit === i ? -1 : i; renderCurrent(); if (noteEdit >= 0) $("noteIn")?.focus(); return; }
  const ns = t.closest("[data-notesave]");
  if (ns){ saveNote(items, Number(ns.dataset.notesave)); return; }
  const tb = t.closest("[data-tab]");
  if (tb){ tab = tb.dataset.tab; renderRecipeSheet(); if (tab === "beetto") runBtSearch(); return; }
  const bp = t.closest("[data-btphase]");
  if (bp){ btPhase = Number(bp.dataset.btphase); renderRecipeSheet(); runBtSearch(); return; }
  const bm = t.closest("[data-btmeal]");
  if (bm){ btMeal = bm.dataset.btmeal; renderRecipeSheet(); runBtSearch(); return; }
  const ba = t.closest("[data-btadd]");
  if (ba){
    items.push({type:"beetto", id: ba.dataset.btadd, name: ba.dataset.name});
    saveCell(openKey, items); renderCurrent(); toast(`「${ba.dataset.name}」を追加しました`); return;
  }
  const gb = t.closest("[data-genre]");
  if (gb){ genre = gb.dataset.genre; renderRecipeSheet(); runSearch(); return; }
  const add = t.closest("[data-add]");
  if (add){
    items.push({type:"recipe", id: add.dataset.add, name: add.dataset.name});
    saveCell(openKey, items); renderCurrent(); toast(`「${add.dataset.name}」を追加しました`); return;
  }
  if (t.id === "addUrl"){
    const url = $("urlIn").value.trim(), name = $("urlName").value.trim(), ing = $("urlIng").value.trim();
    if (url && !/^https?:\/\//.test(url)){ toast("URLは https:// から入れてください"); return; }
    if (!url && !ing){ toast("URLか材料のどちらかを入れてください"); return; }
    if (!url && !name){ toast("料理名を入れてください"); return; }
    const it = {type:"url", url, name: name || url.replace(/^https?:\/\//, "").slice(0, 30)};
    if (ing) it.ing = ing.slice(0, 3000);
    items.push(it);
    saveCell(openKey, items); renderRecipeSheet(); toast("追加しました"); return;
  }
  if (t.id === "addMemo"){
    const name = $("memo").value.trim(); if (!name) return;
    items.push({type:"text", name}); saveCell(openKey, items); renderRecipeSheet(); toast("追加しました"); return;
  }
});
function saveNote(items, i){
  const v = ($("noteIn")?.value || "").trim().slice(0, 100);
  if (!items[i]) return;
  items[i] = {...items[i]};
  if (v) items[i].note = v; else delete items[i].note;
  noteEdit = -1; saveCell(openKey, items); renderCurrent();
  toast(v ? "指示を保存しました" : "指示を消しました");
}
$("sheetBody").addEventListener("keydown", e => {
  if (e.target.id === "noteIn" && e.key === "Enter" && !e.isComposing){ e.preventDefault(); saveNote([...(cells.get(openKey) || [])], noteEdit); }
});
$("sheetBody").addEventListener("input", e => {
  if (e.target.id === "q"){ query = e.target.value; runSearch(); }
  if (e.target.id === "btq"){ btQuery = e.target.value; runBtSearch(); }
});

/* ---------- スクショから材料を読み取る ---------- */
// 送る前に縮小して、通信量とAIの料金を抑える
async function shrinkImage(file, max = 1600){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}
$("sheetBody").addEventListener("change", async e => {
  if (e.target.id !== "shotIn") return;
  const files = [...e.target.files].slice(0, 4);
  e.target.value = "";
  if (!files.length) return;
  const st = $("shotStatus");
  st.hidden = false; st.textContent = `スクショ${files.length}枚を読み取っています…（10〜20秒）`;
  try {
    const images = await Promise.all(files.map(f => shrinkImage(f)));
    const r = await api("/api/read-image", {method:"POST", body: JSON.stringify({images})});
    if (!r.ingredients){ st.textContent = "材料を読み取れませんでした。材料が写っている画像か確認してください。"; return; }
    if (!$("urlName").value.trim() && r.name) $("urlName").value = r.name;
    $("urlIng").value = (r.base ? `（${r.base}）\n` : "") + r.ingredients;
    st.textContent = "読み取りました。内容を確認して「この料理を追加」を押してください。";
  } catch(err){
    if (err instanceof AuthError) return showLogin(err.message);
    st.textContent = "読み取れませんでした：" + err.message;
  }
});

/* ---------- 買い出しリスト ---------- */
let lastList = null, lastHead = "", lastOther = "", lastRaw = "", checked = new Set();
let currentListId = null, fromHistory = false, checkTimer = null;
$("makeList").onclick = makeList;
$("histBtn").onclick = openHistory;

// 保存済み（または今できた）リストを表示する
function showListData(d, id, checkedKeys){
  currentListId = id || null;
  checked = new Set(checkedKeys || []);
  lastList = d.list || {buy: [], check: []};
  const recipes = Array.isArray(d.recipes) ? d.recipes : [];
  const memos = Array.isArray(d.memos) ? d.memos : [];
  const parts = [recipes.length ? `レシピ${recipes.length}品` : "", memos.length ? `メモ${memos.length}件` : ""].filter(Boolean).join("＋");
  lastHead = (fromHistory ? `<button class="backlink" id="backHist">← 過去のリスト一覧</button>` : "")
    + `<p class="note">${esc(d.span || "")}／${esc(d.people || "")}人分${parts ? "／" + parts : ""}${d.createdLabel ? `<br>${esc(d.createdLabel)}に作成` : ""}</p>`;
  const failed = Array.isArray(d.failed) ? d.failed : [];
  lastOther = failed.length ? `<p class="err">次のページは材料を読み取れなかったため、リストに入っていません：${failed.map(esc).join("、")}。献立のマスで一度外し、「URLを貼る」で材料を貼り付けて登録し直すと計算に入ります。</p>` : "";
  lastRaw = (recipes.length || memos.length) ? `<details><summary>レシピごとの材料（元の表記）とメモ</summary>${recipes.map(r => `<h4>${esc(r.name)}${r.count>1?`（${r.count}回分）`:""}${r.note ? `<small>（指示：${esc(r.note)}）</small>` : ""}</h4><pre>${esc(r.base ? "基準: " + r.base + "\n" : "")}${esc(r.ingredients || "材料の記載なし")}</pre>`).join("")}${memos.length ? `<h4>メモ</h4><pre>${esc(memos.map(m => m.name + (m.count > 1 ? `（${m.count}回分）` : "")).join("\n"))}</pre>` : ""}</details>` : "";
  renderList();
}
const fmtCreated = iso => { const t = new Date(iso); if (isNaN(t)) return ""; return `${t.getMonth()+1}/${t.getDate()}（${"日月火水木金土"[t.getDay()]}）${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`; };

async function openHistory(){
  fromHistory = true; currentListId = null; lastList = null;
  showSheet("過去の買い出しリスト");
  $("sheetBody").innerHTML = `<div class="status"><span class="dot"></span><span>読み込み中…</span></div>`;
  try {
    const { lists } = await api("/api/lists");
    $("sheetBody").innerHTML = lists.length
      ? `<p class="note">新しい順に表示しています。タップすると中身とチェックの状態が見られます。</p><ul class="hist">${lists.map(l => `<li><button data-openlist="${esc(l.id)}"><span class="nm">${esc(l.name)}</span><span class="meta">${esc(fmtCreated(l.created))}に作成</span></button></li>`).join("")}</ul>`
      : `<p class="empty">まだ保存されたリストはありません。「買い出しリストを作る」で作ったリストが、ここに残ります。</p>`;
  } catch(e){
    if (e instanceof AuthError) return showLogin(e.message);
    $("sheetBody").innerHTML = `<p class="err">読み込めませんでした：${esc(e.message)}</p>`;
  }
}
async function openSavedList(id){
  showSheet("買い出しリスト");
  $("sheetBody").innerHTML = `<div class="status"><span class="dot"></span><span>読み込み中…</span></div>`;
  try {
    const r = await api(`/api/lists?id=${encodeURIComponent(id)}`);
    showListData({...r.data, createdLabel: fmtCreated(r.created)}, r.id, r.checked);
  } catch(e){
    if (e instanceof AuthError) return showLogin(e.message);
    $("sheetBody").innerHTML = `<button class="backlink" id="backHist">← 過去のリスト一覧</button><p class="err">読み込めませんでした：${esc(e.message)}</p>`;
  }
}
// チェックはNotionにも保存して、ふたりで共有する
function saveChecked(){
  if (!currentListId) return;
  clearTimeout(checkTimer);
  const id = currentListId, keys = [...checked];
  checkTimer = setTimeout(() => {
    api("/api/lists", {method:"POST", body: JSON.stringify({id, checked: keys})}).catch(e => { if (!(e instanceof AuthError)) toast("チェックを保存できませんでした"); });
  }, 700);
}

async function makeList(){
  const items = rangeItems();
  const recipeItems = items.filter(x => x.type === "recipe" && x.id);
  const others = items.filter(x => x.type === "text");
  const counts = new Map();
  // 同じレシピでも「指示」が違えば別々に数える
  const tally = (map, x) => { const k = x.id + "\n" + (x.note || ""); const c = map.get(k) || {id: x.id, note: x.note || "", count: 0}; c.count++; map.set(k, c); };
  for (const x of recipeItems) tally(counts, x);
  const entries = [...counts.values()];
  const btCounts = new Map();
  for (const x of items.filter(x => x.type === "beetto" && x.id)) tally(btCounts, x);
  const beetto = [...btCounts.values()];
  const urlCounts = new Map();
  for (const x of items.filter(x => x.type === "url" && (x.url || x.ing))){
    const k = x.url + "\n" + (x.ing || "") + "\n" + (x.note || "");
    const cur = urlCounts.get(k) || {name: x.name, url: x.url, ing: x.ing || "", note: x.note || "", count: 0};
    cur.count++; urlCounts.set(k, cur);
  }
  const extras = [...urlCounts.values()];
  const people = Number($("ppl").value);
  const span = selB ? `${label(selA.d, selA.s)} → ${label(selB.d, selB.s)}` : label(selA.d, selA.s);
  checked = new Set(); lastList = null; currentListId = null; fromHistory = false;
  showSheet("買い出しリスト");
  const memoCounts = new Map();
  for (const o of others) memoCounts.set(o.name, (memoCounts.get(o.name) || 0) + 1);
  const memos = [...memoCounts].map(([name, count]) => ({name, count}));
  lastHead = `<p class="note">${esc(span)}／${people}人分／${[entries.length + beetto.length + extras.length ? `レシピ${entries.length + beetto.length + extras.length}品` : "", memos.length ? `メモ${memos.length}件` : ""].filter(Boolean).join("＋")}</p>`;
  lastOther = "";
  lastRaw = "";
  $("sheetBody").innerHTML = `${lastHead}<div class="status"><span class="dot"></span><span>レシピを読んで、材料を合算しています…（20秒ほど）</span></div>${lastOther}`;
  try {
    const res = await api("/api/shopping", {method:"POST", body: JSON.stringify({entries, beetto, extras, memos, people, title: span})});
    showListData({span, people, list: res.list, failed: res.failed, recipes: res.recipes, memos}, res.listId, []);
  } catch(e){
    if (e instanceof AuthError) return showLogin(e.message);
    $("sheetBody").innerHTML = `${lastHead}<p class="err">リストを作れませんでした：${esc(e.message)}</p>${lastOther}`;
  }
}

function itemRow(key, name, sub, amt){
  const done = checked.has(key);
  return `<label class="item${done ? " done" : ""}"><input type="checkbox" data-ck="${esc(key)}" ${done ? "checked" : ""}><span class="nm">${esc(name)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span><span class="amt">${esc(amt || "")}</span></label>`;
}
function renderList(){
  const L = lastList || {};
  const rank = c => { const i = CATS.indexOf(c); return i < 0 ? 98 : i; };
  const buy = (Array.isArray(L.buy) ? L.buy : []).filter(c => c && Array.isArray(c.items) && c.items.length)
    .sort((a, b) => rank(a.category) - rank(b.category));
  const check = Array.isArray(L.check) ? L.check : [];
  const total = buy.reduce((n, c) => n + c.items.length, 0);
  const left = buy.reduce((n, c) => n + c.items.filter(it => !checked.has("b:" + it.name)).length, 0);
  let h = `${lastHead}<div class="row2"><button class="btn ghost" id="copyList">リストをコピー</button></div>`;
  h += `<p class="lbl">買うもの　残り ${left} / ${total}</p>`;
  for (const c of buy){
    h += `<div class="cat"><h3>${esc(c.category || "その他")}</h3>${c.items.map(it => itemRow("b:" + it.name, it.name, [it.note, (it.recipes || []).join("、")].filter(Boolean).join("　"), it.amount)).join("")}</div>`;
  }
  if (check.length) h += `<div class="checkbox"><p class="ck-h">常備品　残っているか確認</p><p class="ck-list">${check.map(it => esc(it.name)).join("、")}</p></div>`;
  h += lastOther + lastRaw;
  const b = $("sheetBody"), top = b.scrollTop;
  b.innerHTML = h; b.scrollTop = top;
}
$("sheetBody").addEventListener("change", e => {
  const k = e.target.dataset?.ck; if (!k) return;
  if (e.target.checked) checked.add(k); else checked.delete(k);
  renderList(); saveChecked();
});
$("sheetBody").addEventListener("click", e => {
  const ol = e.target.closest("[data-openlist]");
  if (ol){ openSavedList(ol.dataset.openlist); return; }
  if (e.target.id === "backHist"){ openHistory(); return; }
});
$("sheetBody").addEventListener("click", async e => {
  if (e.target.id !== "copyList" || !lastList) return;
  const lines = [];
  for (const c of lastList.buy || []){ lines.push(`【${c.category}】`); for (const it of c.items || []) lines.push(`□ ${it.name} ${it.amount || ""}`.trim()); }
  if ((lastList.check || []).length) lines.push("【常備品チェック】", lastList.check.map(x => x.name).join("、"));
  try { await navigator.clipboard.writeText(lines.join("\n")); toast("コピーしました。LINEなどに貼り付けできます"); }
  catch(_){ toast("コピーできませんでした"); }
});

/* ---------- 設定（右上の歯車） ---------- */
const THEMES = [["auto","自動"],["light","ライト"],["dark","ダーク"]];
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  const bg = getComputedStyle(document.body).backgroundColor;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
}
let theme = "auto";
try { theme = localStorage.getItem("kondate.theme") || "auto"; } catch(e){}
applyTheme(theme);

let settingsOpen = false;
function renderSettings(){
  $("sheetBody").innerHTML = `
    <div><p class="lbl">画面の明るさ</p>
      <div class="seg three" role="group" aria-label="画面の明るさ">${THEMES.map(([k, l]) => `<button data-theme-opt="${k}" aria-pressed="${k === theme}">${l}</button>`).join("")}</div>
      <p class="note" style="margin-top:6px">「自動」はスマホの設定に合わせます。この端末だけの設定です。</p></div>`;
}
$("gearBtn").addEventListener("click", () => {
  openKey = null;
  showSheet("設定"); settingsOpen = true; renderSettings();
});
$("sheetBody").addEventListener("click", e => {
  if (!settingsOpen) return;
  const b = e.target.closest("[data-theme-opt]"); if (!b) return;
  theme = b.dataset.themeOpt;
  try { localStorage.setItem("kondate.theme", theme); } catch(err){}
  applyTheme(theme); renderSettings();
});

/* ---------- お知らせ ---------- */
let tt = null;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; t.classList.toggle("top", !$("sheet").hidden); clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

/* ---------- 起動 ---------- */
const setBarH = () => document.documentElement.style.setProperty("--barh", $("bar").offsetHeight + "px");
let started = false;
async function start(){
  $("login").hidden = true; $("app").hidden = false;
  setBarH(); render();
  await loadPlan();
  if (!started){
    started = true;
    new ResizeObserver(setBarH).observe($("bar"));
    setInterval(() => { if (!document.hidden && $("sheet").hidden) loadPlan(); }, 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadPlan(); });
  }
}
start();
})();
</script>
